name: keep-supabase-awake

# Supabase free projects pause after 7 days without activity, which takes the
# TopNote app (and App Review) offline. Two light requests a day keep it awake.
on:
  schedule:
    - cron: '17 3,15 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database through the public REST API
        run: |
          key=$(curl -fsS https://gimzimean.github.io/topnote/config.js | grep -o "sb_publishable_[A-Za-z0-9_-]*")
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $key" -H "Authorization: Bearer $key" \
            "https://rtedhhpfynmrldnaddxl.supabase.co/rest/v1/app_flags?select=key&limit=1")
          echo "REST status $code"
          test "$code" -lt 500
