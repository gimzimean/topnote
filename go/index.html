<html lang="ko"><head><meta charset="utf-8">

<script>
// 광고·초대 링크 하나로 폰에 맞는 스토어로 보낸다 (2026-10-29).
//   ?c=캠페인(기본 none) ?src·?s=소스(기본 direct — 2026-10-30: 주소만 복사해 온 사람이 틱톡으로 잡히던 것 수정)
//   ?talk=4인 수다 친구 코드 · ?invite=멤버 초대 코드 → 안드로이드는 플레이 referrer 에 실어 보낸다
//   (앱이 첫 실행 때 설치 referrer 를 읽는다). 아이폰은 referrer 가 없어 코드를 복사한 뒤 앱스토어로 간다.
(function(){
  var q=new URLSearchParams(location.search), clean=function(v,re){return (v||'').replace(re,'')};
  var c=clean(q.get('c')||'none',/[^\w-]/g), src=clean(q.get('src')||q.get('s')||'direct',/[^\w-]/g);
  // src 가 없으면 열린 앱(앱 안 브라우저 표시)과 직전 사이트로 출처를 찾는다(2026-10-30 대표 「src 없어도 유입 무조건 찾아내줘」).
  if(!q.get('src')&&!q.get('s')){
    var u0=navigator.userAgent||'', rf=''; try{rf=document.referrer?new URL(document.referrer).hostname:''}catch(e){}
    src=/Barcelona/i.test(u0)||/threads\.(net|com)/.test(rf)?'threads'
      :/Instagram/i.test(u0)||/instagram\.com/.test(rf)?'instagram'
      :/musical_ly|BytedanceWebview|trill|TikTok/i.test(u0)||/tiktok\.com/.test(rf)?'tiktok'
      :/FBAN|FBAV|FB_IAB/i.test(u0)||/facebook\.com/.test(rf)?'facebook'
      :/KAKAOTALK/i.test(u0)||/kakao/.test(rf)?'kakaotalk'
      :/NAVER/i.test(u0)||/naver\.com/.test(rf)?'naver'
      :/Line\//.test(u0)?'line'
      :/google\./.test(rf)?'google'
      :rf&&!/gimzimean\.github\.io|topnote\.app/.test(rf)?rf.replace(/^www\./,'').replace(/[^\w-]/g,'_').slice(0,40)
      :'direct';
  }
  var talk=clean(q.get('talk')||q.get('talkCode'),/[^A-Za-z0-9]/g).toUpperCase().slice(0,12);
  var invite=clean(q.get('invite'),/[^A-Za-z0-9]/g).toUpperCase().slice(0,16);
  if(talk||invite){ if(!q.get('src')&&!q.get('s')) src='invite'; if(c==='none') c=talk?'talk_invite':'member_invite'; }
  var ua=navigator.userAgent||'';
  var ios=/iPhone|iPad|iPod/i.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1);
  // PC(안드로이드·아이폰이 아닌 기기)는 플레이 앱 주소(intent://)를 못 열어 멈췄다 → 웹 플레이 페이지로 바로 보낸다(2026-10-30).
  var android=/Android/i.test(ua);
  var ref='utm_source='+src+'&utm_medium='+(talk||invite?'referral':'paid')+'&utm_campaign='+c+(talk?'&talkCode='+talk:'')+(invite?'&invite='+invite:'');
  var apple='https://apps.apple.com/kr/app/id6813747102?ct='+c;
  var play='https://play.google.com/store/apps/details?id=com.topnote.app&referrer='+encodeURIComponent(ref);
  window.__go={ios:ios,apple:apple,play:play,code:talk||invite,kind:talk?'talk':(invite?'invite':'')};
  // 운영실 퍼널: 스토어로 보낸 한 번을 marketing_events 에 남긴다(공개 키 · 넣기만 됨 · 개인정보 없음).
  var sid=(crypto.randomUUID&&crypto.randomUUID())||'00000000-0000-4000-8000-'+String(Date.now()).slice(-12).padStart(12,'0');
  try{fetch('https://rtedhhpfynmrldnaddxl.supabase.co/rest/v1/marketing_events',{method:'POST',keepalive:true,headers:{'apikey':'sb_publishable_bh8B8BvCaWUo_ikNX4eQIQ_R-1AgXQc','Authorization':'Bearer sb_publishable_bh8B8BvCaWUo_ikNX4eQIQ_R-1AgXQc','Content-Type':'application/json','Prefer':'return=minimal'},
    body:JSON.stringify({event_name:'page_view',session_id:sid,utm_source:src,utm_campaign:c,utm_content:(talk?'go_talk':invite?'go_invite':'go_'+(ios?'ios':'android')),path:'/go/'})}).catch(function(){});}catch(e){}
  // 안드로이드는 웹 플레이 페이지가 아니라 플레이 스토어 앱의 설치 화면을 바로 연다(2026-10-30 대표 「바로 설치할 수 있게」).
  //   틱톡 등 인앱 브라우저: market:// (인앱 브라우저가 플레이 앱으로 넘긴다)
  //   크롬·삼성 인터넷: intent:// (플레이 앱, 없으면 웹 플레이로)
  var pq='id=com.topnote.app&referrer='+encodeURIComponent(ref);
  var inapp=/musical_ly|BytedanceWebview|trill|TikTok|FBAN|FBAV|Instagram|KAKAOTALK|NAVER|; wv\)/i.test(ua);
  var market='market://details?'+pq;
  var intent='intent://details?'+pq+'#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url='+encodeURIComponent(play)+';end';
  window.__go.android=android?(inapp?market:intent):play;
  // PC(안드로이드·아이폰이 아닌 것)는 넘기지 않고 두 스토어 단추를 보여준다(2026-10-30 대표 「PC에서 안드로이드로만 가」).
  var mobile=ios||/Android/i.test(ua);
  window.__go.pc=!mobile;
  // 단계 기록(운영실 진단용): 자동 이동 뒤에도 이 화면에 남아 있으면 stuck, 버튼을 누르면 tap (path /go-step/).
  window.__go.step=function(k){try{fetch('https://rtedhhpfynmrldnaddxl.supabase.co/rest/v1/marketing_events',{method:'POST',keepalive:true,headers:{'apikey':'sb_publishable_bh8B8BvCaWUo_ikNX4eQIQ_R-1AgXQc','Authorization':'Bearer sb_publishable_bh8B8BvCaWUo_ikNX4eQIQ_R-1AgXQc','Content-Type':'application/json','Prefer':'return=minimal'},
    body:JSON.stringify({event_name:'page_view',session_id:sid,utm_source:src,utm_campaign:c,utm_content:k+'_'+(ios?'ios':'android')+(inapp?'_inapp':''),path:'/go-step/'})}).catch(function(){});}catch(e){}};
  if(!window.__go.code&&mobile){
    setTimeout(function(){location.replace(ios?apple:window.__go.android);},150);
    // 틱톡·인스타 앱 안 브라우저가 market:// 를 막으면 화면이 그대로 남는다(2026-10-30) → 2초 뒤에도 보이면 기록.
    setTimeout(function(){ if(document.visibilityState==='visible') window.__go.step('stuck'); },2000);
  }
})();
</script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#1b1414;color:#1b1414;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
.page{max-width:460px;min-height:100vh;margin:0 auto;background:#F3EBDD;padding:22px 24px 28px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:3px;color:#9a7b5b}
.top b{font-family:Georgia,serif;font-size:20px;letter-spacing:0;color:#1b1414}.top b i,.logo i{color:#B85F45;font-style:normal}
.hero{padding:34px 0 22px;border-bottom:1px solid #d9cbb6}
.eyebrow{font-size:11px;letter-spacing:3px;color:#9a7b5b;margin-bottom:12px}
.hl{font-family:Georgia,"Apple SD Gothic Neo",serif;font-size:40px;font-weight:700;line-height:1.18;letter-spacing:-.5px;margin:0}
.lead{font-size:16px;color:#5a4a44;line-height:1.6;margin:14px 0 0}
ol.steps{list-style:none;padding:0;margin:0}
ol.steps li{display:flex;gap:14px;align-items:baseline;padding:14px 0;border-bottom:1px solid #d9cbb6;font-size:15px;line-height:1.45}
ol.steps li span{font-family:Georgia,serif;font-size:13px;color:#B85F45;min-width:22px}
.note{font-size:13px;color:#7a6a60;margin:14px 0 18px;line-height:1.5}
.cta{margin-top:auto}
#waitMsg{font-size:12px;color:#8a7a72;text-align:center;margin:0 0 10px}
a,button{display:block;width:100%;margin:10px 0 0;padding:16px;border-radius:14px;border:0;background:#1b1414;color:#fff;font-size:16px;font-weight:700;text-decoration:none;text-align:center;cursor:pointer}
a.main{background:#1b1414;font-size:18px;padding:18px}
a.sub{background:transparent;color:#1b1414;border:1px solid #c9b79d;font-size:14px;padding:13px}
.foot{font-size:10px;color:#a8988e;text-align:center;margin-top:18px}
#code{max-width:460px;margin:0 auto;background:#F3EBDD;min-height:100vh;padding:80px 24px;text-align:center}
#code h1{font-family:Georgia,"Apple SD Gothic Neo",serif;font-size:28px;margin:0 0 24px}
</style>
</head><body>
<!-- 자동 이동이 막힐 때만 남는 작은 랜딩(2026-10-30 대표 「③ 합치기 + 설명 조금」). 이미지 없이 글만이라 느려지지 않는다. -->
<!-- 자동 이동이 막힐 때·PC에서만 보이는 랜딩(2026-10-30 대표 「너무 구려, 랜딩페이지처럼」). 이미지 없이 글만이라 느려지지 않는다. -->
<div id="wait" class="page">
  <div class="top"><b>T<i>.</i></b><span>TOP NOTE · 탑노트</span></div>
  <div class="hero">
    <div class="eyebrow">BEFORE YOU MEET</div>
    <h1 class="hl">만나기 전에,<br>3분 먼저.</h1>
    <p class="lead">사진 말고 목소리로 먼저 만나요.<br>안 맞으면 잃는 건 3분뿐이에요.</p>
  </div>
  <ol class="steps">
    <li><span>01</span>인증한 사람과 3분 통화</li>
    <li><span>02</span>둘 다 원하면 사진과 인증 공개</li>
    <li><span>03</span>둘 다 원하면 번호 교환</li>
    <li><span>+</span>1:1이 떨리면 넷이 하는 4인 수다</li>
  </ol>
  <p class="note">연락처에 있는 사람과는 서로 연결되지 않아요.</p>
  <div class="cta">
    <p id="waitMsg">스토어로 가는 중이에요. 안 열리면 눌러 주세요.</p>
    <a id="aMain" class="main" href="https://play.google.com/store/apps/details?id=com.topnote.app">앱 받기 · 무료</a>
    <a id="aOther" class="sub" href="https://apps.apple.com/kr/app/id6813747102">다른 폰이에요</a>
  </div>
  <div class="foot">몬타나 주식회사 · 만 19세 이상</div>
</div>
<!-- 설명 없이 제목과 단추만(2026-10-30 대표 「초대코드 설명이 너무 길다, 문구는 적지 말고」): 앱이 코드를 저절로 읽어 같은 방에 앉힌다. -->
<div id="code" hidden><h1 id="ttl">친구가 4인 수다에 불렀어요</h1><button id="btn" type="button">앱 받기</button></div>
<script>
// 저절로 안 넘어가면 누를 단추: 폰에 맞는 스토어를 위로, 안드로이드는 플레이 앱으로(설치 referrer 그대로).
(function(){var g=window.__go; if(!g)return; var a=document.getElementById('aMain'), b=document.getElementById('aOther');
  if(g.pc){ a.href=g.apple; a.textContent='App Store에서 받기'; a.className='main'; b.href=g.play; b.textContent='Google Play에서 받기'; b.className='main';
    var w=document.getElementById('waitMsg'); if(w) w.hidden=true; return; }
  // 큰 단추 = 이 폰의 스토어, 작은 단추 = 다른 폰 스토어.
  if(g.ios){ a.href=g.apple; b.href=g.play; } else { a.href=g.play; b.href=g.apple; }
  // 버튼은 market:// 대신 https 플레이 주소: 앱 안 브라우저가 market:// 를 막아 버튼까지 안 눌리던 문제(2026-10-30). 안드로이드는 이 주소를 플레이 앱으로 연다.
  a.addEventListener('click',function(){g.step&&g.step('tap')}); b.addEventListener('click',function(){g.step&&g.step('tap')});
})();
</script>
<script>
(function(){var g=window.__go; if(!(g&&g.code))return;
  document.getElementById('wait').hidden=true; document.getElementById('code').hidden=false;
  if(g.kind==='invite') document.getElementById('ttl').textContent='탑노트 초대장이 왔어요';
  var text=(g.kind==='talk'?'topnote-talk:':'topnote-invite:')+g.code;
  document.getElementById('btn').onclick=function(){
    var go=function(){location.href=g.ios?g.apple:g.android};
    try{navigator.clipboard.writeText(text).then(go,go);}catch(e){go();}
  };
})();
</script>
</body></html>
